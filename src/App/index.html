<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script
      src="https://kit.fontawesome.com/401c9283dc.js"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <div class="grid min-h-screen overflow-auto">
      <div
        class="fixed min-h-screen w-[16%] flex flex-col items-center border-r border-gray-200 shadow-2xl project-div"
      >
        <h1 class="font-bold text-3xl my-[1rem]">Todo List</h1>
        <div class="w-full h-8 flex justify-center items-center gap-5">
          <input
            type="text"
            placeholder="type something here..."
            class="newProject w-[50%] border border-gray-300 rounded-md ml-2 pl-2 placeholder:text-xs"
          />
          <button class="text-xs text-white add-btn bg-green mr-2 px-2 py-1">
            Add
            <!-- <i class="fa-solid fa-plus text-base hover:text-xl"></i> -->
          </button>
        </div>
        <ul class="project-ul"></ul>
      </div>
      <div
        class="todo-list grid grid-cols-4 grid-flow-row-dense auto-rows-[200px] h-full gap-5 pl-80 pr-5 py-10"
      ></div>
    </div>

    <dialog
      class="dialogForm h-1/4 w-1/4 border border-gray-300 rounded-lg inset-x-0 inset-48 mx-auto bg-white flex-col text-justify"
    >
      <div
        class="w-full bg-green h-10 relative rounded-t-lg justify-center items-center flex"
      >
        <button class="closeBtn text-white text-lg font-bold absolute right-2">
          x
        </button>
        <p class="title-todo text-white font-bold"></p>
      </div>
      <p class="todoDescription"></p>
      <p class="todoDue"></p>
      <p class="todoPriority"></p>
      <p class="todoNotes"></p>
    </dialog>

    <!-- create and update Form -->
    <dialog
      class="ProjectForms h-2/4 w-1/4 border border-gray-300 rounded-lg inset-x-0 inset-48 mx-auto bg-white flex-col text-justify"
    >
      <div
        class="w-full bg-green h-10 relative rounded-t-lg justify-center items-center flex"
      >
        <p class="text-base text-white font-bold">Forms</p>
        <button class="closeBtn text-white text-lg font-bold absolute right-2">
          x
        </button>
      </div>
      <div class="flex flex-col gap-2 mx-10 mt-5">
        <div class="flex flex-col">
          <p class="text-xs">Title</p>
          <input
            type="text"
            class="border border-gray-300 rounded-sm pl-2 todoTitleInput"
          />
        </div>
        <div class="flex flex-col">
          <p class="text-xs">Description</p>
          <textarea
            class="border border-gray-300 rounded-sm pl-2 todoDescriptionInput"
          ></textarea>
        </div>
        <div class="flex flex-col">
          <p class="text-xs">Due</p>
          <input
            type="date"
            class="border border-gray-300 rounded-sm pl-2 todoDueInput"
          />
        </div>
        <div class="flex flex-col">
          <p class="text-xs">Priority</p>
          <select
            name="priority"
            id="priority"
            class="border border-gray-300 rounded-sm pl-2 todoPriorityInput"
          >
            <option value="Low">Low</option>
            <option value="Medium">Medium</option>
            <option value="High">High</option>
          </select>
        </div>
        <div class="flex flex-col">
          <p class="text-xs">Notes</p>
          <textarea
            class="border border-gray-300 rounded-sm pl-2 todoNotesInput"
          ></textarea>
        </div>
      </div>
      <div class="flex gap-5 justify-end mt-5 mr-10">
        <button class="bg-green text-xs px-5 py-2 confirmBtn text-white">
          Confirm
        </button>
        <button class="bg-red text-xs px-5 py-2 cancelBtn text-white">
          Cancel
        </button>
      </div>
    </dialog>
  </body>
</html>
